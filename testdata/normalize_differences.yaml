# Corpus inputs (go-ttsnorm/corpus) whose kokoro-run phonemes deliberately differ
# from the phonemes of the golden normalize_text reading. integration/normalize_test.go
# fails on any other difference, and on an entry here that no longer differs.
# Prepared with markdown and normalize on, as the server does by default.
#
# letters:     capitals spell letters and AM/PM; Misaki reads the golden's
#              lower-case "a" and "a m" as the article.
# punctuation: apostrophes, quotes, parentheses and the symbols Misaki says as
#              words (& + @) are kept; the golden drops them ("don t").
# markdown:    markup, list markers and link targets are removed.

